<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E" />
      <stop offset="100%" stop-color="#C58541" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)" />

  <!-- Background Architecture/Tiles Hint -->
  <path d="M20 70 L180 70 M20 110 L180 110 M60 20 L60 180 M140 20 L140 180" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35" />

  <!-- Body / Uniform -->
  <path d="M40 200 C40 150 70 142 100 142 C130 142 160 150 160 200 Z" fill="url(#shirtGrad)" />
  
  <!-- Work Vest / Overalls Accent -->
  <path d="M55 200 L68 152 L90 152 L85 200 Z" fill="url(#vestGrad)" />
  <path d="M145 200 L132 152 L110 152 L115 200 Z" fill="url(#vestGrad)" />
  <path d="M90 170 L110 170 L105 200 L95 200 Z" fill="#F8FAFC" />
  <!-- Tool pocket -->
  <rect x="116" y="165" width="18" height="22" rx="3" fill="#004D40" stroke="#0F766E" stroke-width="1.5" />
  <!-- Wrench peek -->
  <path d="M125 158 L125 170" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round" />
  <circle cx="125" cy="157" r="3" fill="none" stroke="#F1F5F9" stroke-width="2" />

  <!-- Neck -->
  <rect x="86" y="115" width="28" height="30" rx="4" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="100" cy="92" rx="34" ry="40" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="65" cy="94" r="8" fill="#C58541" />
  <circle cx="135" cy="94" r="8" fill="#C58541" />

  <!-- Hair -->
  <path d="M66 84 C66 52 82 46 100 46 C118 46 134 52 134 84 C128 72 118 68 100 68 C82 68 72 72 66 84 Z" fill="#1E293B" />
  <path d="M64 88 C62 76 68 62 82 52 C94 44 116 44 126 54 C134 62 138 74 136 88 C132 80 128 76 122 75 C108 72 90 73 78 78 C72 80 66 84 64 88 Z" fill="#0F172A" />

  <!-- Eyebrows -->
  <path d="M78 80 Q87 76 94 80" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M106 80 Q113 76 122 80" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <circle cx="86" cy="89" r="4.5" fill="#0F172A" />
  <circle cx="114" cy="89" r="4.5" fill="#0F172A" />
  <circle cx="88" cy="87.5" r="1.5" fill="#FFFFFF" />
  <circle cx="116" cy="87.5" r="1.5" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M100 88 L98 99 L104 99" stroke="#9A5B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Friendly Confident Smile -->
  <path d="M86 109 Q100 122 114 109" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="#FFFFFF" />

  <!-- Neat short beard / stubble contour -->
  <path d="M76 96 C76 126 84 134 100 134 C116 134 124 126 124 96" stroke="#0F172A" stroke-opacity="0.15" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>

