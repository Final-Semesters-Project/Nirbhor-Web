<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE9E62" />
      <stop offset="100%" stop-color="#C28045" />
    </linearGradient>
    <linearGradient id="poloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad2)" />

  <!-- Background Tech subtle circuit lines -->
  <path d="M30 60 H170 M40 100 H160 M50 140 H150" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4,4" />

  <!-- Shoulders & Polo Shirt -->
  <path d="M40 200 C40 152 68 140 100 140 C132 140 160 152 160 200 Z" fill="url(#poloGrad)" />
  <!-- Polo Collar -->
  <path d="M82 140 L100 162 L88 178 L72 145 Z" fill="#004D40" />
  <path d="M118 140 L100 162 L112 178 L128 145 Z" fill="#004D40" />
  <path d="M96 162 L104 162 L102 188 L98 188 Z" fill="#E2E8F0" />
  <circle cx="100" cy="172" r="2" fill="#64748B" />
  <circle cx="100" cy="182" r="2" fill="#64748B" />

  <!-- Technician ID Badge Lanyard -->
  <path d="M80 140 L88 200" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M120 140 L112 200" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Neck -->
  <rect x="87" y="112" width="26" height="32" rx="4" fill="url(#skinGrad2)" />

  <!-- Head -->
  <ellipse cx="100" cy="90" rx="33" ry="38" fill="url(#skinGrad2)" />

  <!-- Ears -->
  <circle cx="67" cy="92" r="7.5" fill="#C28045" />
  <circle cx="133" cy="92" r="7.5" fill="#C28045" />

  <!-- Hair -->
  <path d="M68 80 C68 50 82 44 100 44 C118 44 132 50 132 80 C126 70 116 66 100 66 C84 66 74 70 68 80 Z" fill="#1E293B" />
  <!-- Neat sideburns -->
  <path d="M68 80 L68 94 L72 90 Z" fill="#1E293B" />
  <path d="M132 80 L132 94 L128 90 Z" fill="#1E293B" />

  <!-- Eyebrows -->
  <path d="M78 78 Q86 74 93 77" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M107 77 Q114 74 122 78" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes with friendly glint -->
  <ellipse cx="86" cy="86" rx="4.5" ry="4" fill="#0F172A" />
  <ellipse cx="114" cy="86" rx="4.5" ry="4" fill="#0F172A" />
  <circle cx="87.5" cy="84.5" r="1.5" fill="#FFFFFF" />
  <circle cx="115.5" cy="84.5" r="1.5" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M100 84 L97 97 L103 97" stroke="#A7692B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Warm Confidence Smile -->
  <path d="M86 106 Q100 120 114 106" stroke="#854D0E" stroke-width="3" stroke-linecap="round" fill="#FFFFFF" />
</svg>

